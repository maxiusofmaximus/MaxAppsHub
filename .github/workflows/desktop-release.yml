name: Desktop release

# Builds the MaxApps Hub on a tag such as desktop-v1.0.1-alpha.2, optionally signs the
# program with SignPath, and leaves a DRAFT GitHub release with the program. The update
# key never goes to GitHub: the maintainer signs locally (see desktop/CODE-SIGNING.md)
# and publishes the draft. Drafts are not listed to the Hub until they are published.

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Work out the version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#desktop-v}" >> "$GITHUB_OUTPUT"

      - name: Build the Hub
        shell: bash
        working-directory: desktop/src-tauri
        run: cargo build --release --locked

      - name: Name the program the way the Hub expects
        shell: bash
        run: |
          mkdir -p staging
          cp desktop/src-tauri/target/release/maxapps-hub-desktop.exe \
            "staging/MaxAppsHub-${{ steps.version.outputs.version }}-desktop.exe"

      - name: Upload the program for signing
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-program
          path: staging/*.exe

      # `secrets` cannot appear in an `if:`, so the check goes through an environment variable.
      - name: Check whether SignPath is set up
        id: signpath
        env:
          SIGNPATH_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        shell: bash
        run: echo "enabled=$([ -n "$SIGNPATH_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Authenticode signing through the SignPath Foundation. Every signing request is
      # approved by hand on SignPath's side.
      - name: Sign with SignPath
        if: steps.signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: maxappshub
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # Until SignPath is set up the program is not signed by Authenticode; the Hub's
      # own update check (the Ed25519 .sig added by the maintainer) still applies.
      - name: Keep the built program when SignPath is not set up
        if: steps.signpath.outputs.enabled != 'true'
        shell: bash
        run: |
          mkdir -p signed
          cp staging/*.exe signed/

      - name: Create the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if [ -f "desktop/notes/$VERSION.md" ]; then
            notes=(--notes-file "desktop/notes/$VERSION.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" signed/*.exe --draft \
            --title "MaxApps Hub $VERSION" "${notes[@]}" "${flags[@]}"
          {
            echo "## Draft release $GITHUB_REF_NAME"
            echo
            echo "The draft holds the program only. Not published yet: the Hub refuses any update without its .sig."
            echo "Sign it on the maintainer's computer, then publish. Steps: desktop/CODE-SIGNING.md, section Release process."
            echo
            echo '```'
            sha256sum signed/*.exe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
