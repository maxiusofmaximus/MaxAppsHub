[package]
name = "maxapps-hub-desktop"
version = "1.0.1-alpha.6"
edition = "2021"
description = "MaxApps Hub para escritorio: instala y actualiza las apps de escritorio publicadas en GitHub"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.8"

[build-dependencies]
winres = "0.1"

[dependencies]
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
gpui = "0.2.2"
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
ureq = { version = "2", features = ["json"] }
tray-icon = "0.26.1"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Time"] }
